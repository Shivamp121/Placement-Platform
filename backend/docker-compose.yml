
services:
  postgres:
    image: postgres:15-alpine
    container_name: jobboard_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: jobboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: jobboard_redis
    restart: always
    ports:
      - "6379:6379"
      
  api:
    build: .
    container_name: jobboard_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/jobboard?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
      - redis

volumes:
  pgdata: